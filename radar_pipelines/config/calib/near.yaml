# Calibration for xwr_raw_ros configs/6843aop/near.cfg.
#
# range_scale = true_range_max_m / raw_range_max_m. true_range_max_m is TI's
# "Maximum unambiguous Range" from the .cfg header, and raw_range_max_m is the
# range_max the driver computes from the profileCfg line. The ratio is TI's
# derating of the maximum range, not a fit to measured distances.
# The azimuth calibration is the identity, so azimuth is not calibrated.
# The values are kept because they produced the recorded results.
# See the package README for details.
profile: near
raw_range_max_m: 3.6141
true_range_max_m: 2.88
range_scale: 0.79688
range_offset: 0.0
range_resolution_m: 0.0452
azimuth_scale: 1.0
azimuth_offset_deg: 0.0
notes: |
  Single-TX profile. Only chirpCfg 0 is defined, although channelCfg enables
  all three TX antennas, so azimuth resolution is about 60 deg. The point-cloud
  pipeline and interferometric elevation need near_mimo.
